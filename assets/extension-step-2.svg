<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Load unpacked extension</title>
  <desc id="desc2">Illustration of Chrome's Load unpacked button and extension folder.</desc>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tenor+Sans&amp;display=swap");
      text { font-family: "Tenor Sans", sans-serif; }
    </style>
  </defs>
  <!-- Background shell -->
  <rect width="720" height="360" rx="20" fill="#FAFCFF" stroke="#77B1D4" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="24" y="24" width="672" height="44" rx="12" fill="#FFFFFF" stroke="#90D5FF" stroke-width="1"/>
  <circle cx="48" cy="46" r="6" fill="#77B1D4"/>
  <circle cx="68" cy="46" r="6" fill="#90D5FF"/>
  <circle cx="88" cy="46" r="6" fill="#57B9FF"/>

  <!-- Load unpacked button -->
  <rect x="48" y="94" width="170" height="42" rx="10" fill="#57B9FF"/>
  <text x="76" y="121" fill="#FFFFFF" font-size="14">Load unpacked</text>

  <!-- Folder selection card -->
  <rect x="48" y="156" width="624" height="136" rx="14" fill="#FFFFFF" stroke="#77B1D4" stroke-width="1.5"/>

  <!-- Folder Icon in Calm Blue -->
  <path d="M76 195h32l12 14h72v44H76z" fill="#90D5FF"/>
  <path d="M76 195h33l10 10h73v10H76z" fill="#77B1D4"/>

  <text x="210" y="216" fill="#517891" font-size="16">autoflow-v3.1.0</text>
  <text x="210" y="242" fill="#77B1D4" font-size="13">Select the folder containing manifest.json</text>

  <text x="48" y="324" fill="#57B9FF" font-size="14">2. Select the extracted Auto Flow extension folder</text>
</svg>
