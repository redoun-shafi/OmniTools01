<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title3 desc3">
  <title id="title3">Open Auto Flow</title>
  <desc id="desc3">Illustration of Auto Flow extension running beside Google Flow.</desc>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tenor+Sans&amp;display=swap");
      text { font-family: "Tenor Sans", sans-serif; }
    </style>
  </defs>
  <!-- Background shell -->
  <rect width="720" height="360" rx="20" fill="#FAFCFF" stroke="#77B1D4" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="24" y="24" width="672" height="44" rx="12" fill="#FFFFFF" stroke="#90D5FF" stroke-width="1"/>
  <rect x="48" y="38" width="110" height="14" rx="7" fill="#90D5FF"/>
  <rect x="172" y="38" width="160" height="14" rx="7" fill="#77B1D4" opacity="0.4"/>

  <!-- Left panel: Google Flow -->
  <rect x="48" y="90" width="370" height="226" rx="14" fill="#FFFFFF" stroke="#77B1D4" stroke-width="1.5"/>
  <circle cx="80" cy="122" r="16" fill="#57B9FF"/>
  <text x="108" y="128" fill="#517891" font-size="16">Google Flow</text>
  <rect x="72" y="156" width="280" height="12" rx="6" fill="#90D5FF" opacity="0.35"/>
  <rect x="72" y="182" width="220" height="12" rx="6" fill="#90D5FF" opacity="0.35"/>
  <rect x="72" y="222" width="124" height="36" rx="18" fill="#57B9FF"/>
  <text x="96" y="245" fill="#FFFFFF" font-size="13">Start queue</text>

  <!-- Right panel: Auto Flow -->
  <rect x="440" y="90" width="232" height="226" rx="14" fill="#FFFFFF" stroke="#57B9FF" stroke-width="1.5"/>
  <text x="466" y="126" fill="#517891" font-size="15">Auto Flow</text>
  <rect x="466" y="150" width="160" height="10" rx="5" fill="#90D5FF" opacity="0.4"/>
  <rect x="466" y="172" width="120" height="10" rx="5" fill="#90D5FF" opacity="0.4"/>

  <circle cx="480" cy="220" r="8" fill="#57B9FF"/>
  <text x="498" y="225" fill="#517891" font-size="13">Connected</text>

  <text x="48" y="338" fill="#57B9FF" font-size="14">3. Open Google Flow and run your automated queue</text>
</svg>
