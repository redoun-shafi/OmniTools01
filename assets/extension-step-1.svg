<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title1 desc1">
  <title id="title1">Open Chrome extensions</title>
  <desc id="desc1">Illustration of the Chrome extensions page with developer mode enabled.</desc>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tenor+Sans&amp;display=swap");
      text { font-family: "Tenor Sans", sans-serif; }
    </style>
  </defs>
  <!-- Background shell -->
  <rect width="720" height="360" rx="20" fill="#FAFCFF" stroke="#77B1D4" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="24" y="24" width="672" height="44" rx="12" fill="#FFFFFF" stroke="#90D5FF" stroke-width="1"/>
  <circle cx="48" cy="46" r="6" fill="#77B1D4"/>
  <circle cx="68" cy="46" r="6" fill="#90D5FF"/>
  <circle cx="88" cy="46" r="6" fill="#57B9FF"/>
  <rect x="120" y="36" width="340" height="20" rx="10" fill="#FAFCFF" stroke="#90D5FF" stroke-width="1"/>
  <text x="136" y="50" fill="#517891" font-size="11" opacity="0.8">chrome://extensions</text>

  <!-- Page Header -->
  <rect x="48" y="94" width="624" height="44" rx="12" fill="#FFFFFF" stroke="#90D5FF" stroke-width="1"/>
  <text x="68" y="122" fill="#517891" font-size="17">Extensions</text>

  <!-- Developer Mode Card -->
  <rect x="48" y="156" width="624" height="136" rx="14" fill="#FFFFFF" stroke="#77B1D4" stroke-width="1.5"/>
  <text x="72" y="194" fill="#517891" font-size="16">Developer mode</text>
  <text x="72" y="222" fill="#77B1D4" font-size="13">Enable this switch to load unpacked extensions locally.</text>

  <!-- Toggle switch -->
  <rect x="560" y="180" width="64" height="32" rx="16" fill="#57B9FF"/>
  <circle cx="608" cy="196" r="12" fill="#FFFFFF"/>

  <!-- Step badge indicator -->
  <circle cx="584" cy="254" r="14" fill="#90D5FF"/>
  <path d="M578 254l4 4 8-8" fill="none" stroke="#517891" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="268" fill="#57B9FF" font-size="14">1. Open chrome://extensions and switch on Developer mode</text>
</svg>
